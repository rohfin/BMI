<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BMI Calculator (Malaysia)</title>
<style>
:root{--bg:#eef6f9;--card:#fff;--tx:#0f2a3d;--mute:#5b7384;--line:#d5e5ec;--accent:#004a77;
--c0:#3b8fd4;--c1:#2fa36b;--c2:#e8a317;--c3:#e8742a;--c4:#d9453d;--c5:#9c2a3a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a24;--card:#152633;--tx:#e6f1f7;--mute:#8fa9b8;--line:#243b4b;--accent:#5fb4ea}}
:root[data-theme="dark"]{--bg:#0d1a24;--card:#152633;--tx:#e6f1f7;--mute:#8fa9b8;--line:#243b4b;--accent:#5fb4ea}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:1.2rem;margin:0 0 2px}
.sub{color:var(--mute);font-size:.85rem;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.row{display:flex;justify-content:space-between;align-items:baseline}
.row label{font-weight:600}
.val{font-size:1.5rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.val small{font-size:.8rem;color:var(--mute);font-weight:500}
.num{width:5.2ch;font:inherit;font-size:1.5rem;font-weight:700;color:var(--accent);background:transparent;border:0;border-bottom:2px dashed var(--line);border-radius:0;text-align:right;padding:0 2px;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num:focus{outline:0;border-bottom:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
input[type=range]{width:100%;height:36px;margin:6px 0 0;accent-color:var(--accent)}
.scale{display:flex;justify-content:space-between;color:var(--mute);font-size:.75rem}
.res{text-align:center}
.bmi{font-size:3.4rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.cls{display:inline-block;margin-top:8px;padding:5px 14px;border-radius:99px;color:#fff;font-weight:700}
.risk{color:var(--mute);font-size:.88rem;margin-top:8px}
.bar{position:relative;display:flex;height:14px;border-radius:7px;overflow:hidden;margin:22px 0 6px}
.bar i{display:block;height:100%}
.pin{position:absolute;top:-6px;width:4px;height:26px;border-radius:2px;background:var(--tx);transform:translateX(-50%);transition:left .08s}
.hw{color:var(--mute);font-size:.85rem;text-align:center;margin-top:10px}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl td{padding:8px 6px;border-top:1px solid var(--line)}
.tbl tr:first-child td{border-top:0}
.tbl td:last-child{text-align:right;color:var(--mute)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.tbl tr.on{font-weight:700;background:color-mix(in srgb,var(--accent) 12%,transparent)}
.note{color:var(--mute);font-size:.75rem;text-align:center}
</style>
</head>
<body>
<main>
<h1>BMI Calculator</h1>
<p class="sub">Asian-Pacific cut-offs for Malaysian adults (&gt;18 years)</p>

<div class="card">
  <div class="row"><label for="w">Weight</label><span class="val"><input class="num" id="wv" type="number" inputmode="decimal" min="20" max="200" step="0.5" value="65" aria-label="Weight in kg"> <small>kg</small></span></div>
  <input id="w" type="range" min="20" max="200" step="0.5" value="65">
  <div class="scale"><span>20</span><span>200</span></div>
  <div class="row" style="margin-top:18px"><label for="h">Height</label><span class="val"><input class="num" id="hv" type="number" inputmode="numeric" min="100" max="220" step="1" value="165" aria-label="Height in cm"> <small>cm</small></span></div>
  <input id="h" type="range" min="100" max="220" step="1" value="165">
  <div class="scale"><span>100</span><span>220</span></div>
</div>

<div class="card res">
  <div class="bmi" id="bmi">0</div>
  <div style="color:var(--mute);font-size:.8rem">kg/m²</div>
  <span class="cls" id="cls">Normal</span>
  <div class="risk" id="risk"></div>
  <div class="bar" id="bar"><div class="pin" id="pin"></div></div>
  <div class="hw" id="hw"></div>
</div>

<div class="card">
  <table class="tbl" id="tbl"></table>
</div>
<p class="note">Risk of comorbidities per Malaysian CPG BMI classification. For guidance only, not medical advice.</p>
</main>
<script>
var C=[
{n:"Underweight",r:"&lt;18.5",max:18.5,k:"--c0",risk:"Low, but with increased risk of other clinical problems"},
{n:"Normal",r:"18.5–22.9",max:23,k:"--c1",risk:"Optimal"},
{n:"Pre-obese (Overweight)",r:"23.0–27.4",max:27.5,k:"--c2",risk:"Increased"},
{n:"Obese I",r:"27.5–32.4",max:32.5,k:"--c3",risk:"High"},
{n:"Obese II",r:"32.5–37.4",max:37.5,k:"--c4",risk:"Very high"},
{n:"Obese III",r:"≥37.5",max:Infinity,k:"--c5",risk:"Extremely high"}];
var MIN=14,MAX=42;
var $=function(i){return document.getElementById(i)};
var bar=$("bar"),tbl=$("tbl");
var edges=[14,18.5,23,27.5,32.5,37.5,42];
C.forEach(function(c,i){
  var e=document.createElement("i");
  e.style.width=((edges[i+1]-edges[i])/(MAX-MIN)*100)+"%";
  e.style.background="var("+c.k+")";
  bar.insertBefore(e,$("pin"));
  var tr=document.createElement("tr");tr.id="r"+i;
  tr.innerHTML='<td><span class="dot" style="background:var('+c.k+')"></span>'+c.n+'</td><td>'+c.r+'</td>';
  tbl.appendChild(tr);
});
function upd(){
  var w=parseFloat($("w").value),h=parseFloat($("h").value);
  if(document.activeElement!==$("wv"))$("wv").value=w;if(document.activeElement!==$("hv"))$("hv").value=h;
  var m=h/100,b=w/(m*m);
  $("bmi").textContent=b.toFixed(1);
  var idx=0;while(b>=C[idx].max)idx++;
  var c=C[idx];
  $("cls").textContent=c.n;$("cls").style.background="var("+c.k+")";
  $("risk").textContent="Risk of comorbidities: "+c.risk;
  var p=Math.max(MIN,Math.min(MAX,b));
  $("pin").style.left=((p-MIN)/(MAX-MIN)*100)+"%";
  $("hw").textContent="Normal weight for your height: "+(18.5*m*m).toFixed(1)+" – "+(22.9*m*m).toFixed(1)+" kg";
  for(var i=0;i<C.length;i++)$("r"+i).className=i===idx?"on":"";
}
$("w").addEventListener("input",upd);$("h").addEventListener("input",upd);
[["wv","w"],["hv","h"]].forEach(function(p){
  var n=$(p[0]),s=$(p[1]);
  n.addEventListener("focus",function(){n.select()});
  n.addEventListener("input",function(){var v=parseFloat(n.value);if(isNaN(v)||v<+s.min||v>+s.max)return;s.value=v;upd()});
  function commit(){var v=parseFloat(n.value);if(isNaN(v))v=+s.value;v=Math.max(+s.min,Math.min(+s.max,v));s.value=v;n.value=s.value;upd()}
  n.addEventListener("blur",commit);
  n.addEventListener("keydown",function(e){if(e.key==="Enter")n.blur()});
});
upd();
</script>
</body>
</html>
